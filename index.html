<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuća u Ostružnici · 3D modeli</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1d2327;--bar:#f1f3f4;--line:#d4d9dc;--acc:#2d5d82;--accfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161b1e;--fg:#e8eef0;--bar:#222a2e;--line:#3a464c;--acc:#8cb8d4;--accfg:#10202a}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
nav{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav b{margin-right:6px;font-size:13px}
nav button{font:600 13px system-ui,sans-serif;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
nav small{opacity:.7;margin-left:auto}
#wrap{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
iframe.on{display:block}
</style>
</head>
<body>
<nav id="nav"><b>Kuća u Ostružnici</b></nav>
<div id="wrap"></div>
<script>
const M=[
 {id:'model-1',t:'1 · Originalna osnova',f:'model2.html',d:'Originalna osnova'},
 {id:'model-2',t:'2 · Pravougaona osnova',f:'model1.html',d:'Pravougaona osnova, izmenjeni teren'},
 {id:'model-3',t:'3 · Rotirana uz istočnu među',f:'model3.html',d:'Zarotirana 20,27° uz istočnu među'}];
const nav=document.getElementById('nav'),wrap=document.getElementById('wrap'),sm=document.createElement('small');
M.forEach(m=>{const b=document.createElement('button');b.textContent=m.t;b.onclick=()=>show(m.id);m.b=b;nav.appendChild(b);
 const f=document.createElement('iframe');f.title=m.t;f.allow='fullscreen';m.fr=f;wrap.appendChild(f);});
nav.appendChild(sm);
function show(id,fromHash){const m=M.find(x=>x.id===id)||M[0];
 M.forEach(x=>{x.b.setAttribute('aria-pressed',x===m);x.fr.classList.toggle('on',x===m);});
 if(!m.fr.src)m.fr.src=m.f; sm.textContent=m.d;
 if(!fromHash){try{history.replaceState(null,'','#'+m.id)}catch(e){location.hash=m.id}}}
addEventListener('hashchange',()=>show(location.hash.slice(1),true));
show(location.hash.slice(1),true);
</script>
</body>
</html>
